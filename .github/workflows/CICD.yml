name: GameStore Deploy

on:
  push:
    branches:
      - dev
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Prepare WordPress Zip
        run: |
          WP_LINK=$(cat wp-version-control.cfg)
          wget -O "./wordpress.zip" $WP_LINK

      - name: Prepare plugins and themes zip
        run: zip -r wpcontent.zip plugins mu-plugins themes

      - name: Set deployment path
        id: paths
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            echo "DEPLOY_PATH=/var/www/html/dev.mysite.poltava.ua" >> $GITHUB_ENV
          else
            echo "DEPLOY_PATH=/var/www/html/mysite.poltava.ua" >> $GITHUB_ENV
          fi

      - name: Copy zips to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: "./wordpress.zip, ./wpcontent.zip"
          target: ${{ env.DEPLOY_PATH }}

      - name: Enable Maintenance Mode
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          source: ".maintenance"
          target: ${{ env.DEPLOY_PATH }}

      - name: Update WordPress Core
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            find . -maxdepth 1 -type f -name "*.php" ! -name "wp-config.php" -delete
            rm -rf wp-admin wp-includes
            unzip -o wordpress.zip -d temp-wordpress
            mv temp-wordpress/* ./
            rm -rf temp-wordpress

      - name: Update Plugins and Themes
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            # Проверим, что zip на месте
            ls -lah
            # Если wp-content уже существует — удаляем старые каталоги
            if [ -d "wp-content" ]; then
              rm -rf wp-content/plugins wp-content/mu-plugins wp-content/themes
            fi
            # Распаковываем wpcontent.zip прямо в wp-content
            unzip -o wpcontent.zip -d wp-content

      - name: Disable Maintenance Mode
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            rm -f .maintenance wpcontent.zip wordpress.zip
